<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cclist - ClaudeCode List</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- xterm.js stable version (5.5.0) to avoid DOM Renderer bugs in 5.6.0-beta -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-content">
                <h1>cclist - ClaudeCode List</h1>
                <div class="header-actions">
                    <button id="discoverBtn" class="btn btn-icon" title="Discover Repositories">🔍</button>
                    <button id="refreshBtn" class="btn btn-icon" title="Refresh">🔄</button>
                    <button id="settingsBtn" class="btn btn-icon" title="Settings">⚙️</button>
                    <span class="port-info">Port: <span id="portNumber">8080</span></span>
                </div>
            </div>
        </header>

        <main id="mainContent">
            <!-- Content will be dynamically loaded here -->
        </main>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
